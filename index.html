<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f7fa;
      color: #222;
    }
    h1 { margin-bottom: 4px; }
    .total { font-size: 1.4rem; margin: 12px 0 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 20px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    #name { flex: 2; min-width: 0; }
    #amount { flex: 1; min-width: 0; }
    button { padding: 10px 14px; border: none; border-radius: 6px; background: #2563eb; color: white; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; }
    li button { background: #dc2626; padding: 4px 10px; font-size: 0.9rem; margin-left: 10px; }
    li button:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <h1>Expense Tracker</h1>
  <div class="total">Total: <span id="total">0</span></div>

  <div class="row">
    <input id="name" type="text" placeholder="What did you buy?">
    <input id="amount" type="number" placeholder="Amount">
    <button onclick="addExpense()">Add</button>
  </div>

  <ul id="list"></ul>

  <script>
    // Our list of expenses lives here
    let expenses = [];

    function addExpense() {
      const name = document.getElementById("name").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);

      // Don't add if something is missing
      if (name === "" || isNaN(amount)) return;

      expenses.push({ name: name, amount: amount });

      document.getElementById("name").value = "";
      document.getElementById("amount").value = "";
      showExpenses();
    }

    function deleteExpense(index) {
      expenses.splice(index, 1);
      showExpenses();
    }

    function showExpenses() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      let total = 0;

      expenses.forEach(function (item, index) {
        total += item.amount;
        const li = document.createElement("li");

        const text = document.createElement("span");
        text.textContent = item.name + ": " + item.amount;

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = function () { deleteExpense(index); };

        li.appendChild(text);
        li.appendChild(del);
        list.appendChild(li);
      });

      document.getElementById("total").textContent = total;
    }
  </script>
</body>
</html>
